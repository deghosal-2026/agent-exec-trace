services:
  # Jaeger all-in-one: primary trace backend for local development.
  # Receives traces via OTLP gRPC on port 4317, UI on port 16686.
  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC ingestion
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # OpenTelemetry Collector: optional intermediary for the collector-mediated
  # export path (3.4).  Configured to forward OTLP traces to Jaeger.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.107.0
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    volumes:
      - ./deploy/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger

  # Tempo (Grafana) is an alternative OTel backend.  It is enabled via the
  # `tempo` profile so the default local stack stays Jaeger-first:
  #   docker compose --profile tempo up -d
  # This preserves the OTel-first positioning (3.3) without changing the default.
  # Note: Tempo maps host port 4319 → container 4317 to avoid conflicting with
  # Jaeger's OTLP port.  Use ``--endpoint http://localhost:4319`` when running
  # the demo against Tempo.
  tempo:
    image: grafana/tempo:2.4.1
    profiles: ["tempo"]
    ports:
      - "3200:3200"     # Tempo UI
      - "4319:4317"     # OTLP gRPC (host: 4319, container: 4317)
    command: [ "-config.file=/etc/tempo-config.yml" ]
    volumes:
      - ./deploy/tempo-config.yml:/etc/tempo-config.yml:ro

  # Postgres: product read-model database for the analytics service.
  # Stores run summaries, anomalies, fleet rollups, and version cohort
  # summaries materialized from raw traces.
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API service: product-facing read API for the web app.
  # Serves run timelines, fleet health, version compare, and anomaly inbox
  # from the normalized Postgres read model.
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      API_DB_DSN: postgresql://analytics:analytics@postgres:5432/analytics
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      API_CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      API_LOG_LEVEL: "INFO"
    depends_on:
      postgres:
        condition: service_healthy

  # Analytics worker: polling loop that fetches traces from Jaeger, runs
  # all 35 detectors, persists anomalies, and materializes fleet rollups.
  analytics:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    environment:
      ANALYTICS_DB_DSN: postgresql://analytics:analytics@postgres:5432/analytics
      ANALYTICS_JAEGER_ENDPOINT: http://jaeger:16686
      ANALYTICS_COLLECTOR_ENDPOINT: http://otel-collector:4318
      ANALYTICS_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

  # Web app: React + Vite frontend served in dev mode.
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ""
      VITE_PROXY_TARGET: http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
