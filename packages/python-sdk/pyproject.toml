[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-exec-trace"
version = "0.1.0"
description = "Execution traces for agent behavior - OpenTelemetry-style observability for AI agent workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=1.0",
]
otlp = [
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
    "mypy>=1.13",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["agent_exec_trace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"